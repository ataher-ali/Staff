const cv=()=>S.scope=='month'?cfg(S.month):S.s;
const ct=()=>S.scope=='month'?(S.ms[S.month]||(S.ms[S.month]=norm(S.s))):S.s;

/* Time, date and filter helpers */
function tm(x){const m=String(x||'').trim().match(/^(\d{1,2})[:.](\d{2})(?::\d{2})?\s*([ap]m)?$/i);if(!m)return null;let h=+m[1];const mi=+m[2];
 if(m[3]){if(h<1||h>12)return null;h=h%12+(m[3].toLowerCase()=='pm'?12:0)}
 return h>23||mi>59?null:h*60+mi}
function pdate(x){let y,m,d,r;const v=String(x||'').trim();
 if(r=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)){y=+r[1];m=+r[2];d=+r[3]}
 else if(r=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/)){d=+r[1];m=+r[2];y=+r[3]}
 else return null;
 const z=new Date(Date.UTC(y,m-1,d));
 return z.getUTCFullYear()==y&&z.getUTCMonth()==m-1&&z.getUTCDate()==d?z.toISOString().slice(0,10):null}
const bdn=x=>String(x??'').replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c));
const fe=()=>S.emps.filter(e=>(!S.fb||(e.branch||'').trim()==S.fb)&&(!S.fd||(e.desig||'').trim()==S.fd));
const uniq=k=>[...new Set(S.emps.map(e=>(e[k]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const fixF=()=>{if(S.fb&&!uniq('branch').includes(S.fb))S.fb='';if(S.fd&&!uniq('desig').includes(S.fd))S.fd=''};
const filt=()=>{
 const sel=(f,key,v)=>{const u=uniq(key);return u.length?`<label class="flex items-center gap-2 text-sm text-slate-500">${t(f)}<select data-f="${f}" class="${inp} !w-auto"><option value="">${t('fAll')}</option>${u.map(x=>`<option value="${esc(x)}" ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`:''};
 return sel('fb','branch',S.fb)+sel('fd','desig',S.fd);
};

/* Leave: unpaid leave, and paid leave beyond its quota (quota 0 = no limit), is deducted at one day of salary. */
const dn=c=>c.name||T[S.lang]['lcd_'+c.id]||t('newCat');
function lvCalc(e,mo){
 const L=S.leaves.filter(x=>x.emp==e.id&&x.date.slice(0,7)<=mo).sort((a,b)=>a.date.localeCompare(b.date));
 const cnt={};let vd=0,vx=0;
 L.forEach(x=>{
  const c=S.lc.find(k=>k.id==x.cat),inMo=x.date.startsWith(mo);
  let ex=true;
  if(c){const key=c.id+'|'+(c.per=='month'?x.date.slice(0,7):x.date.slice(0,4));cnt[key]=(cnt[key]||0)+1;ex=!c.paid||(c.quota>0&&cnt[key]>c.quota)}
  if(inMo){vd++;if(ex)vx++}
 });
 const used=c=>cnt[c.id+'|'+(c.per=='month'?mo:mo.slice(0,4))]||0;
 return{vd,vx,used};
}

function calc(e,mo=S.month){
 const s=cfg(mo),r=S.recs.filter(x=>x.emp==e.id&&x.date.startsWith(mo)).sort((a,b)=>a.date.localeCompare(b.date));
 let ld=0,m=0;
 r.forEach(x=>{if(x.late>s.grace)ld++});
 let n=0,cov=0;
 if(s.ld.on&&s.ld.days>0){
  const g=s.ld.rep?Math.floor(ld/s.ld.days):(ld>=s.ld.days?1:0);
  n=g*s.ld.deduct;cov=s.ld.skip?g*s.ld.days:0;
 }
 let seen=0;
 r.forEach(x=>{
  if(s.late&&x.late>s.grace){seen++;if(seen>cov)m+=x.late-s.grace}
  else if(x.late>s.grace)seen++;
  if(s.early)m+=x.early;if(s.absent)m+=x.abs;
 });
 const wd=s.wd||1,rate=e.salary/((wd*s.wh*60)||1);
 const lv=lvCalc(e,mo),vded=lv.vx*e.salary/wd,dd=n*e.salary/wd,md=m*rate,tot=Math.min(e.salary,dd+md+vded);
 return{ld,m,dd,md,tot,net:e.salary-tot,rate,vd:lv.vd,vx:lv.vx,vded,lv};
}

function policy(){

 const h=x=>(b?['১','২','৩','৪','৫','৬','৭','৮'][n++]:++n)+'. '+x;
 const L=['='.repeat(40),b?'   উপস্থিতি ও বেতন কর্তন নীতিমালা':'   Attendance & Salary Deduction Policy','='.repeat(40),(b?'মাস: ':'Month: ')+S.month,''];
 L.push(h(b?'সাধারণ নিয়ম':'General rules'));
 L.push('   - '+(b?`মাসে কর্মদিবস: ${F(s.wd)} দিন`:`Working days per month: ${s.wd}`));
 L.push('   - '+(b?`দৈনিক কর্মঘণ্টা: ${F(s.wh)} ঘণ্টা`:`Work hours per day: ${s.wh}`));
 L.push('   - '+(b?`অফিস সময়: ${s.ti} থেকে ${s.to}`:`Office time: ${s.ti} to ${s.to}`));
 L.push('   - '+(b?'মিনিট-রেট = মাসিক বেতন ÷ (কর্মদিবস × কর্মঘণ্টা × ৬০)':'Minute rate = monthly salary / (working days x work hours x 60)'));
 if(s.grace>0)L.push('   - '+(b?`প্রতিদিন ${F(s.grace)} মিনিট পর্যন্ত লেট গণনা হবে না`:`Up to ${s.grace} minute(s) of lateness per day is not counted`));
 if(s.ld.on){L.push('',h(b?'লেট উপস্থিতি (দিন ভিত্তিক)':'Late attendance (by days)'));
  L.push('   - '+(b?`মাসে ${F(s.ld.days)} দিন লেট হলে ${F(s.ld.deduct)} দিনের বেতন কর্তন করা হবে`:`If late ${s.ld.days} day(s) in a month, ${s.ld.deduct} day(s) of salary will be deducted`));
  if(s.ld.rep)L.push('   - '+(b?'প্রতি একই সংখ্যক লেট দিনের জন্য এই কর্তন পুনরাবৃত্তি হবে':'The deduction repeats for every such number of late days'));
  L.push('   - '+(s.ld.skip?(b?'যে লেট দিনগুলোর জন্য দিন কর্তন হয়েছে (মাসের প্রথম দিক থেকে ধরে), সেই দিনগুলোর লেট মিনিট আলাদাভাবে কাটা হবে না':'Late minutes of the late days already penalised (counted from the start of the month) will not be deducted again'):(b?'দিন কর্তনের পাশাপাশি সেই লেট দিনগুলোর লেট মিনিটও আলাদাভাবে কাটা হবে':'Late minutes of those late days will also be deducted in addition to the day deduction')));}
 if(s.late)L.push('',h(b?'লেট উপস্থিতি (মিনিট ভিত্তিক)':'Late attendance (by minutes)'),'   - '+(b?'অনুমোদিত উপস্থিতির সময়ের পর আসলে প্রতি মিনিটের জন্য মিনিট-রেট অনুযায়ী বেতন কর্তন':'Each minute after the allowed in-time is deducted at the minute rate'));
 if(s.early)L.push('',h(b?'অফিস শেষের আগে ত্যাগ':'Early leave'),'   - '+(b?'অফিস শেষ হওয়ার আগে কর্মস্থল ত্যাগ করলে প্রতি মিনিটের জন্য বেতন কর্তন':'Leaving before office ends is deducted for each minute at the minute rate'));
 if(s.absent)L.push('',h(b?'কর্মসময়ের মাঝে অনুপস্থিতি':'Absence during work time'),'   - '+(b?'অফিস সময়ের মধ্যে নির্ধারিত সময় কর্মস্থলে না থাকলে প্রতি মিনিটের জন্য বেতন কর্তন':'Being away during office hours is deducted for each minute at the minute rate'));
 if(S.lc.length){L.push('',h(b?'ছুটি':'Leave'));
  S.lc.forEach(c=>L.push('   - '+dn(c)+': '+(c.paid?(b?'বেতনসহ':'paid')+(c.quota>0?(b?`, ${c.per=='month'?'প্রতি মাসে':'প্রতি বছরে'} ${F(c.quota)} দিন`:`, ${F(c.quota)} day(s) per ${c.per}`):(b?', কোটা সীমাহীন':', no limit')):(b?'বেতনবিহীন':'unpaid'))));
  L.push('   - '+(b?'কোটার অতিরিক্ত এবং বেতনবিহীন ছুটির প্রতিদিনের জন্য এক দিনের বেতন (মাসিক বেতন ÷ কর্মদিবস) কর্তন করা হবে':"Each day of unpaid leave, and of paid leave beyond its quota, is deducted at one day's salary (monthly salary / working days)"));}
 const sal=20000,den=(s.wd*s.wh*60)||1,r=sal/den;
 L.push('',h(b?'উদাহরণ':'Example'),'   - '+(b?`বেতন ${F(sal)} হলে মিনিট-রেট ≈ ${F(r)}; ৬০ মিনিটের কর্তন ≈ ${F(r*60)}`:`Salary ${sal}: minute rate ~ ${F(r)}; 60 minutes = ${F(r*60)}`));
 L.push('','-'.repeat(40),(b?'কর্তৃপক্ষ: ____________   কর্মচারী: ____________':'Authority: ____________   Employee: ____________'));
 return L.join('\n');
}

function monthSum(){

 const rows=ms.map(m=>{const a={ld:0,tot:0,net:0};fe().forEach(e=>{const c=calc(e,m);a.ld+=c.ld;a.tot+=c.tot;a.net+=c.net});

}

function restoreFile(f,cat='auto'){
 const r=new FileReader();
 r.onerror=()=>alert(t('rsErr'));
 r.onload=()=>{
  let j;try{j=JSON.parse(r.result)}catch(e){return alert(t('rsErr'))}
  const d=j&&j.app=='hajira-hisab'&&j.data&&typeof j.data=='object'?j.data:null;
  if(!d)return alert(t('rsErr'));
  const str=v=>String(v??'');
  let E=null,R=null,V=null,LC=null;
  if(Array.isArray(d.emps)){const m=new Map();d.emps.forEach(x=>{if(x&&x.id!==undefined&&x.id!==''&&x.name&&+x.salary>0)m.set(str(x.id),{id:str(x.id),name:str(x.name),salary:+x.salary,branch:str(x.branch),desig:str(x.desig),phone:str(x.phone)})});E=[...m.values()]}
  if(Array.isArray(d.recs)){const m=new Map();d.recs.forEach(x=>{if(x&&x.emp!==undefined&&DRE.test(x.date))m.set(str(x.emp)+'|'+x.date,{emp:str(x.emp),date:x.date,late:+x.late||0,early:+x.early||0,abs:+x.abs||0})});R=[...m.values()]}
  if(Array.isArray(d.leaves)){const m=new Map();d.leaves.forEach(x=>{if(x&&x.emp!==undefined&&x.cat!==undefined&&DRE.test(x.date))m.set(str(x.emp)+'|'+x.date,{emp:str(x.emp),date:x.date,cat:str(x.cat)})});V=[...m.values()]}
  if(Array.isArray(d.lc)){const m=new Map();d.lc.forEach(x=>{if(x&&x.id!==undefined&&x.id!=='')m.set(str(x.id),{id:str(x.id),name:str(x.name),paid:!!x.paid,quota:Math.max(0,+x.quota||0),per:x.per=='month'?'month':'year'})});LC=[...m.values()]}
  let hasS=!!d.s&&typeof d.s=='object';
  if(!E&&!R&&!V&&!LC&&!hasS)return alert(t('rsErr'));
  /* a category's Restore button brings back only that part of the file */
  const all=['emp','rec','lv','lvc','set'],W={auto:all,all:all,emp:['emp'],rec:['rec'],recm:['rec'],lv:['lv'],lvm:['lv'],lvc:['lvc'],set:['set']}[cat]||all;
  if(!W.includes('emp'))E=null;if(!W.includes('rec'))R=null;if(!W.includes('lv'))V=null;if(!W.includes('lvc'))LC=null;if(!W.includes('set'))hasS=false;
  const fm=typeof j.month=='string'&&MRE.test(j.month)?j.month:null;
  const mo=(cat=='recm'||cat=='lvm')?(fm||S.month):fm;
  if(cat=='recm'&&R){R=R.filter(x=>x.date.startsWith(mo));if(!R.length)R=null}
  if(cat=='lvm'&&V){V=V.filter(x=>x.date.startsWith(mo));if(!V.length)V=null}
  if(!E&&!R&&!V&&!LC&&!hasS)return alert(t('rsNone'));
  const info=[];
  if(E)info.push(`${t('catEmp')}: ${F(E.length)}`);
  if(R)info.push(`${mo?t('catRecM').replace(/\(.*\)/,'')+'('+mo+')':t('catRec')}: ${F(R.length)}`);
  if(V)info.push(`${mo?t('catLvM').replace(/\(.*\)/,'')+'('+mo+')':t('catLv')}: ${F(V.length)}`);
  if(LC)info.push(`${t('catLvC')}: ${F(LC.length)}`);
  if(hasS)info.push(t('catSet'));
  if(!confirm(t('rsQ')+'\n\n'+info.join('\n')))return;
  if(E)S.emps=E;
  if(R)S.recs=mo?S.recs.filter(x=>!x.date.startsWith(mo)).concat(R.filter(x=>x.date.startsWith(mo))):R;
  if(V)S.leaves=mo?S.leaves.filter(x=>!x.date.startsWith(mo)).concat(V.filter(x=>x.date.startsWith(mo))):V;
  if(LC)S.lc=LC;
  if(hasS){S.s=norm(d.s);if(d.ms&&typeof d.ms=='object'){S.ms={};for(const k in d.ms)if(MRE.test(k))S.ms[k]=norm(d.ms[k])}}
  if(j.cat=='all'&&(cat=='auto'||cat=='all')&&(d.lang=='bn'||d.lang=='en'))S.lang=d.lang;
  save();render();alert(t('rsOk'));
 };
 r.readAsText(f);
}

const val=i=>$(i).value.trim();
const A={
 tab(d){S.tab=d.t;S.edit=null;render()},
 lang(d){S.lang=d.v;save();render()},
 scope(d){S.scope=d.v;render()},
 rmCfg(){delete S.ms[S.month];save();render()},
 pickMonth(d){S.month=d.m;render()},
 saveEmp(){
  const id=val('f-id'),name=val('f-name'),salary=+val('f-sal'),branch=val('f-br'),desig=val('f-des'),phone=val('f-ph');
  if(!id||!name||!(salary>0))return alert(t('errReq'));
  if(S.edit)Object.assign(S.emps.find(x=>x.id==S.edit),{name,salary,branch,desig,phone}),S.edit=null;
  else{if(S.emps.some(x=>x.id==id))return alert(t('errDup'));S.emps.push({id,name,salary,branch,desig,phone})}
  save();render();
 },
 togImp(){S.imp=!S.imp;render()},
 doImp(){
  const rows=$('imp-t').value.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  const bd=s=>String(s||'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[,\s৳]/g,'');
  let a=0,u=0,k=0;
  rows.forEach((l,i)=>{
   const c=(l.includes('\t')?l.split('\t'):l.split(',')).map(x=>x.trim().replace(/^"|"$/g,''));
   const [id,name,sal,branch='',desig='',phone='']=c,salary=+bd(sal);
   if(i==0&&!(salary>0))return;
   if(!id||!name||!(salary>0)){k++;return}
   const o={id,name,salary,branch,desig,phone},ex=S.emps.find(x=>x.id==id);
   if(ex){Object.assign(ex,o);u++}else{S.emps.push(o);a++}
  });
  save();S.imp=false;render();
  alert(`${t('impAdd')}: ${F(a)}, ${t('impUpd')}: ${F(u)}, ${t('impSkip')}: ${F(k)}`);
 },
 editEmp(d){S.edit=d.id;render()},
 cancelEdit(){S.edit=null;render()},
 delEmp(d){if(!confirm(t('delQ')))return;S.emps=S.emps.filter(x=>x.id!=d.id);S.recs=S.recs.filter(x=>x.emp!=d.id);S.leaves=S.leaves.filter(x=>x.emp!=d.id);save();render()},
 saveRec(){
  const emp=val('r-emp'),date=val('r-date'),late=+val('r-late')||0,early=+val('r-early')||0,abs=+val('r-abs')||0;
  if(!emp||!date||late<0||early<0||abs<0)return alert(t('errReq'));
  if(late+early+abs>cfg(date.slice(0,7)).wh*60)return alert(t('errMin'));
  S.recs=S.recs.filter(x=>!(x.emp==emp&&x.date==date));S.recs.push({emp,date,late,early,abs});
  S.selEmp=emp;S.selDate=date;S.month=date.slice(0,7);save();render();
 },
 delRec(d){S.recs=S.recs.filter(x=>!(x.emp==d.emp&&x.date==d.date));save();render()},
 doImpA(){
  const mode=$('b-mode').value;S.bm=mode;
  const rows=$('imp-a').value.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  let a=0,u=0,o=0,k=0;
  rows.forEach((l,i)=>{
   const c=(l.includes('\t')?l.split('\t'):l.split(',')).map(x=>bdn(x.trim().replace(/^"|"$/g,'')));
   const d=pdate(c[1]);
   if(!d){if(i>0)k++;return}
   const emp=S.emps.find(x=>String(x.id)==c[0]);
   if(!emp){k++;return}
   const cf=cfg(d.slice(0,7));
   let late,early;const abs=Math.max(0,+c[4]||0);
   if(mode=='time'){const ti=tm(c[2]),to=tm(c[3]);late=ti===null?0:Math.max(0,ti-tm(cf.ti));early=to===null?0:Math.max(0,tm(cf.to)-to)}
   else{late=Math.max(0,+c[2]||0);early=Math.max(0,+c[3]||0)}
   if(late+early+abs>cf.wh*60){k++;return}
   const ix=S.recs.findIndex(x=>String(x.emp)==String(emp.id)&&x.date==d);
   if(!(late||early||abs)){if(ix>=0){S.recs.splice(ix,1);u++}else o++;return}
   const r={emp:String(emp.id),date:d,late,early,abs};
   if(ix>=0){S.recs[ix]=r;u++}else{S.recs.push(r);a++}
  });
  save();render();
  alert(`${t('impAdd')}: ${F(a)}, ${t('impUpd')}: ${F(u)}, ${t('impOn')}: ${F(o)}, ${t('impSkip')}: ${F(k)}`);
 },
 csv(){
  const q=v=>{let x=String(v??'');if(/^[=+\-@\t\r]/.test(x))x="'"+x;return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  const r2=x=>Math.round(x*100)/100,Z={sal:0,ld:0,m:0,dd:0,md:0,vd:0,vded:0,tot:0,net:0};
  const L=[['id','name','branch','desig','salary','lateDays','minutes','dayDed','minDed','lvDays','lvDed','dedAll','net'].map(k=>q(t(k))).join(',')];
  fe().forEach(e=>{const c=calc(e);Z.sal+=e.salary;['ld','m','dd','md','vd','vded','tot','net'].forEach(k=>Z[k]+=c[k]);
   L.push([q(e.id),q(e.name),q(e.branch),q(e.desig),r2(e.salary),c.ld,c.m,r2(c.dd),r2(c.md),c.vd,r2(c.vded),r2(c.tot),r2(c.net)].join(','))});
  L.push([q(t('total')),'','','',r2(Z.sal),Z.ld,Z.m,r2(Z.dd),r2(Z.md),Z.vd,r2(Z.vded),r2(Z.tot),r2(Z.net)].join(','));
  const tag=[S.fb,S.fd].filter(Boolean).join('-').replace(/[\\\/:*?"<>|\s]+/g,'-');
  dlFile(`salary-statement-${S.month}${tag?'-'+tag:''}.csv`,'﻿'+L.join('\r\n'),'text/csv;charset=utf-8');
 },
 prt(){
  const st=document.createElement('style');st.textContent='@page{size:A4 landscape;margin:10mm}';document.head.appendChild(st);
  const rm=()=>{st.remove();window.removeEventListener('afterprint',rm)};
  window.addEventListener('afterprint',rm);window.print();
 },
 saveLv(){
  const emp=val('l-emp'),cat=val('l-cat'),from=val('l-from'),to=val('l-to')||from;
  if(!emp||!S.lc.some(c=>c.id==cat)||!DRE.test(from)||!DRE.test(to))return alert(t('errReq'));
  const p=x=>Date.UTC(+x.slice(0,4),+x.slice(5,7)-1,+x.slice(8,10)),days=(p(to)-p(from))/864e5;
  if(!(days>=0&&days<=61))return alert(t('lvRange'));
  const add=[];for(let i=0;i<=days;i++)add.push(new Date(p(from)+i*864e5).toISOString().slice(0,10));
  S.leaves=S.leaves.filter(x=>!(x.emp==emp&&add.includes(x.date)));
  add.forEach(date=>S.leaves.push({emp,date,cat}));
  S.lvEmp=emp;S.lvCat=cat;S.lvFrom=from;S.lvTo=to;S.month=from.slice(0,7);save();render();
 },
 delLv(d){S.leaves=S.leaves.filter(x=>!(x.emp==d.emp&&x.date==d.date));save();render()},
 lcAdd(){S.lc.push({id:'c'+Date.now().toString(36),name:t('newCat'),paid:true,quota:0,per:'year'});save();render()},
 lcDel(d){
  if(S.leaves.some(x=>x.cat==d.id))return alert(t('lcInUse'));
  if(!confirm(t('delQ')))return;
  S.lc=S.lc.filter(x=>x.id!=d.id);if(S.lvCat==d.id)S.lvCat='';save();render();
 },
 lcPaid(d){const c=S.lc.find(x=>x.id==d.id);if(c){c.paid=!c.paid;save();render()}},
 dl(){dlFile(`policy-${S.lang}-${S.month}.txt`,'\ufeff'+policy(),'text/plain;charset=utf-8')},
 bkp(d){
  const c=d.c,nm={all:'all',emp:'employees',rec:'attendance',recm:'attendance-'+S.month,lv:'leave',lvm:'leave-'+S.month,lvc:'leave-categories',set:'settings'}[c];
  dlFile(`hajira-backup-${nm}-${today()}.json`,JSON.stringify(pack(c),null,1),'application/json');
 },
 rst(d){
  const c=d.c;
  const q=c=='all'?t('resetQ'):t('resetOneQ')+'\n\n'+t(cats[c].l)+(c=='recm'||c=='lvm'?' – '+S.month:'');
  if(!confirm(q))return;
  if(c=='all'){const l=S.lang;S=clone(D);S.lang=l;S.tab='data'}
  else if(c=='emp')S.emps=[];
  else if(c=='rec')S.recs=[];
  else if(c=='recm')S.recs=S.recs.filter(x=>!x.date.startsWith(S.month));
  else if(c=='lv')S.leaves=[];
  else if(c=='lvm')S.leaves=S.leaves.filter(x=>!x.date.startsWith(S.month));
  else if(c=='lvc')S.lc=clone(D.lc);
  else if(c=='set'){S.s=clone(D.s);S.ms={};S.scope='def'}
  save();render();
 }
};
document.addEventListener('click',e=>{
 const s=e.target.closest('[data-sw]');
 if(s){const o=ct(),p=s.dataset.sw;setP(o,p,!getP(o,p));save();render();return}
 const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a.dataset);
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.set!==undefined){setP(ct(),el.dataset.set,Math.max(0,+el.value||0));save();render()}
 else if(el.dataset.time!==undefined){if(tm(el.value)!==null){setP(ct(),el.dataset.time,el.value);save()}render()}
 else if(el.dataset.f!==undefined){S[el.dataset.f]=el.value;render()}
 else if(el.id=='b-mode')S.bm=el.value;
 else if(el.id=='r-in'||el.id=='r-out')autoTime();
 else if(el.hasAttribute('data-month')&&el.value){S.month=el.value;render()}
 else if(el.id=='r-emp')S.selEmp=el.value;
 else if(el.id=='r-date'&&el.value){S.selDate=el.value;autoTime()}
 else if(el.id=='l-emp')S.lvEmp=el.value;
 else if(el.id=='l-cat')S.lvCat=el.value;
 else if(el.id=='l-from'&&el.value){S.lvFrom=el.value;if(S.lvTo<el.value){S.lvTo=el.value;$('l-to').value=el.value}}
 else if(el.id=='l-to'&&el.value)S.lvTo=el.value;
 else if(el.dataset.lc!==undefined){
  const c=S.lc.find(x=>x.id==el.dataset.id),f=el.dataset.lc;
  if(c){if(f=='name')c.name=el.value.trim();else if(f=='quota')c.quota=Math.max(0,+el.value||0);else if(f=='per')c.per=el.value=='month'?'month':'year';save();render()}
 }
 else if(el.dataset.rs!==undefined){const f=el.files&&el.files[0];el.value='';if(f)restoreFile(f,el.dataset.rs)}
});
render();
</script>
